<!--
  owner: system
  title: Setup
  description: First-run page that creates the initial administrator and then deletes itself
-->
<page title="Set up your site">
<content>
	<main class="p">
		<div>
			<h2>Welcome to Kempo</h2>
			<p>Create the administrator account for your site. This page deletes itself once you are done.</p>
			<form id="setupForm">
				<div class="mb">
					<label for="name" class="d-b mb-sm">Name</label>
					<input type="text" id="name" name="name" required class="w-full p-sm br">
				</div>
				<div class="mb">
					<label for="email" class="d-b mb-sm">Email</label>
					<input type="email" id="email" name="email" required class="w-full p-sm br">
				</div>
				<div class="mb">
					<label for="password" class="d-b mb-sm">Password</label>
					<input type="password" id="password" name="password" minlength="8" required class="w-full p-sm br">
				</div>
				<button type="submit" class="w-full p-sm br">Create administrator</button>
			</form>
		</div>
	</main>
</content>
<content location="scripts">
	<script type="module">
		import Toast from '{{pathToRoot}}kempo-ui/components/Toast.js';

		const status = await fetch('{{pathToRoot}}setup/api');
		if(!status.ok){
			window.location.href = '{{pathToRoot}}';
		}

		document.getElementById('setupForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const response = await fetch('{{pathToRoot}}setup/api', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					name: document.getElementById('name').value,
					email: document.getElementById('email').value,
					password: document.getElementById('password').value
				})
			});
			const body = await response.json();
			if(!response.ok){
				Toast.error(body.error);
				return;
			}
			window.location.href = '{{pathToRoot}}login';
		});
	</script>
</content>
</page>
