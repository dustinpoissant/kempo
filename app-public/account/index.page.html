<!--
  owner: system
  title: My Account
  description: User account settings and profile management
-->
<page title="My Account">
<content location="head">
<style>
		input.error {
			--c_input_border: var(--c_danger, red);
			--focus_shadow: 0 0 2px 2px var(--c_danger, red);
		}
	</style>
</content>
<content>
<div class="row -mx"><div class="d-span-3 d-flex-0 t-span-1 t-flex-0 m-flex-1 px"></div>
<div class="d-span-6 d-flex-0 t-flex-1 m-span-12 m-flex-0 px"><div class="d-b"><h2>My Account</h2></div>
<div class="row -mx"><div class="d-span-4 d-flex-0 t-span-4 t-flex-0 m-span-12 m-flex-0 px"><div class="d-b"><strong>Name:</strong></div></div>
<div class="d-span-8 d-flex-0 t-span-8 t-flex-0 m-span-12 m-flex-0 px"><k-user-name class="d-ib"></k-user-name></div></div>
<div class="row -mx"><div class="d-span-4 d-flex-0 t-span-4 t-flex-0 m-span-12 m-flex-0 px"><div class="d-b"><strong>Email:</strong></div></div>
<div class="d-span-8 d-flex-0 t-span-8 t-flex-0 m-span-12 m-flex-0 px"><k-user-email class="d-ib"></k-user-email></div></div>
<div class="row -mx"><div class="d-span-4 d-flex-0 t-span-4 t-flex-0 m-span-12 m-flex-0 px"><div class="d-b"><strong>Email Verified:</strong></div></div>
<div class="d-span-8 d-flex-0 t-span-8 t-flex-0 m-span-12 m-flex-0 px"><k-user-email-verified class="d-ib"></k-user-email-verified></div></div>
<div class="row -mx"><div class="d-span-4 d-flex-0 t-span-4 t-flex-0 m-span-12 m-flex-0 px"><div class="d-b"><strong>Member Since:</strong></div></div>
<div class="d-span-8 d-flex-0 t-span-8 t-flex-0 m-span-12 m-flex-0 px"><k-user-created-at class="d-ib"></k-user-created-at></div></div>
<location name="account-details" label="After the Account Details" />
<k-permission has="system:admin:access"><a href="/admin" class="btn primary d-ib mb mrq">Admin Panel</a></k-permission>
<location name="account-links" label="Account Links" />
<button class="btn d-ib mb mrq" type="button" data-change-password>Change Password</button>
<button data-redirect="/login" class="btn danger d-ib mb mrq" type="button" data-logout>Logout</button>
<a href="/delete-account/" class="btn danger d-ib mb mrq">Delete my account</a></div>
<div class="d-span-3 d-flex-0 t-span-1 t-flex-0 m-span-12 m-flex-0 px"></div></div>
<script type="module" src="/kempo/components/UserName.js"></script>
<script type="module" src="/kempo/components/UserEmail.js"></script>
<script type="module" src="/kempo/components/UserEmailVerified.js"></script>
<script type="module" src="/kempo/components/UserCreatedAt.js"></script>
<script type="module" src="/kempo/components/Permission.js"></script>
<script type="module" src="/kempo-ui/components/Icon.js"></script>
<script type="module" src="/kempo/components/ChangePasswordButton.js"></script>
<script type="module" src="/kempo/components/LogoutButton.js"></script>
</content>
</page>
