<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Page content</title>
	<link rel="stylesheet" href="/kempo-css/kempo.min.css">
	<link rel="stylesheet" href="/styles.css">
	<script src="/init.js"></script>
	<script type="module" src="/kempo-ui/utils/theme.js"></script>
	<script type="module" src="/kempo-ui/components/Icon.js"></script>
	<script type="module" src="/kempo/components/Audio.js"></script>
	<script type="module" src="/kempo-ui/components/Video.js"></script>
	<script type="module">
		// Alias k-audio-player to k-audio for backwards compatibility
		customElements.whenDefined('k-audio').then(() => {
			const AudioClass = customElements.get('k-audio');
			if(AudioClass) customElements.define('k-audio-player', AudioClass);
		}).catch(() => {
			// Fallback: try after a delay
			setTimeout(() => {
				const AudioClass = customElements.get('k-audio');
				if(AudioClass && !customElements.get('k-audio-player')) {
					customElements.define('k-audio-player', AudioClass);
				}
			}, 1000);
		});
	</script>
	<style>
		/* The editor's marks on the page: nothing here is part of the published page. */
		body { margin: 0; overflow-x: hidden; }
		#sb-root { --sb-accent: var(--c_success, #2c2); min-height: 100vh; padding: var(--spacer, 1rem); box-sizing: border-box; }
		#sb-root.sb-drag-restricted { --sb-accent: var(--c_warning, #f90); }
		#sb-root:empty::before { content: 'This page has no widgets yet. Use Add in the toolbar.'; display: block; padding: 3rem 1rem; text-align: center; opacity: 0.6; }
		[data-sb-id] { cursor: default; }
		[data-sb-slot]:empty { min-height: 3rem; outline: 1px dashed var(--c_border, #888); outline-offset: -1px; position: relative; }
		[data-sb-slot]:empty::before { content: 'Empty. Select it, then use Add.'; display: block; padding: 0.75rem; text-align: center; opacity: 0.55; font-size: 0.85em; }
		[data-sb-id].sb-selected { outline: 2px solid var(--c_success, #2c2); outline-offset: 2px; }
		[data-sb-id].sb-selected.sb-restricted { outline-color: var(--c_warning, #f90); }
		[data-sb-edit][contenteditable] { cursor: text; outline: 1px dotted var(--c_primary, #36f); }
		k-tab[contenteditable] { display: flex; }
		[data-sb-cell][contenteditable] { cursor: text; outline: 1px dotted var(--c_primary, #36f); min-width: 3rem; }
		.sb-placeholder { border: 1px dashed var(--c_border, #888); padding: 0.75rem; margin-bottom: var(--spacer, 1rem); }
		.sb-placeholder::before { content: attr(data-sb-label); display: block; font-size: 0.8em; font-weight: bold; opacity: 0.7; margin-bottom: 0.25rem; }
		#sb-handle { position: absolute; z-index: 10; display: none; align-items: center; justify-content: center; width: 2rem; height: 1.5rem; background: var(--c_success, #2c2); color: #fff; border-radius: 0.25rem; cursor: grab; }
		#sb-handle { touch-action: none; }
		.sb-dragging, .sb-dragging * { cursor: grabbing !important; user-select: none; }
		#sb-handle.sb-restricted { background: var(--c_warning, #f90); }
		.sb-zone { min-height: 2.5rem; margin: 0.25rem 0; border: 2px dashed var(--sb-accent); border-radius: 0.25rem; box-sizing: border-box; }
		.row > .sb-zone { flex: 0 0 2.5rem; margin: 0 -1.25rem; position: relative; z-index: 5; }
		[data-sb-slot].sb-zone-empty { outline: 2px dashed var(--sb-accent); outline-offset: -2px; }
		.sb-zone-active, [data-sb-slot].sb-zone-active { background: color-mix(in srgb, var(--sb-accent) 45%, transparent); border-color: transparent; outline: none; }
	</style>
</head>
<body>
	<script type="module" src="/kempo/sitebuilder/components/InlineToolbar.js"></script>
	<main id="sb-root"></main>
	<k-inline-toolbar></k-inline-toolbar>
	<div id="sb-handle" title="Drag to move"><k-icon name="drag-handle"></k-icon></div></body>
</html>
