<page title="Pages - Admin">
	<content>
		<script
			type="module"
			src="/kempo-ui/components/Table.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/Tabs.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcFirstPage.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcPrevPage.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcNextPage.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcLastPage.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcPageSelect.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcPageSize.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcDeleteRecord.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcDeleteSelected.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/Icon.js"
		></script>
		<script
			type="module"
			src="/kempo-ui/components/controls/TcOpen.js"
		></script>
		<script
			type="module"
			src="/kempo/components/Permission.js"
		></script>
		<div class="d-f mb">
			<h1 class="flex mb0">Pages</h1>
			<div class="flex"></div>
			<div>
				<span id="scanInfo" class="muted"></span>
				<button id="rescanBtn">Rescan</button>
			</div>
		</div>

		<k-tabs active="custom" hash-routing>
			<k-tab for="custom">Custom</k-tab>
			<k-tab for="extension">Extensions</k-tab>
			<k-tab for="system">System</k-tab>

			<k-tab-content name="custom">
				<k-table open-on-click
					id="customTable"
					enable-pages
					page-size="25"
					page-size-options="[10,25,50,100]"
					placeholder="No custom pages have been created yet."
				>
					<kc-tc-open slot="before"></kc-tc-open>
					<div
						slot="top"
						class="d-f full"
						style="align-items: center; gap: var(--spacer);"
					>
						<div>
							<k-permission has="system:pages:delete">
								<kc-tc-delete-selected></kc-tc-delete-selected>
							</k-permission>
						</div>
						<div class="flex"></div>
						<div>
							<input type="search" class="page-search" placeholder="Search custom pages" aria-label="Search custom pages">
						</div>
						<k-permission has="system:pages:create">
							<button id="createPageBtn" class="primary mr"><k-icon name="add"></k-icon> Create Page</button>
						</k-permission>
					</div>
					<div
						class="d-f full"
						style="align-items: center;"
					>
						<div>
							<kc-tc-first-page></kc-tc-first-page>
							<kc-tc-prev-page></kc-tc-prev-page>
							<kc-tc-next-page></kc-tc-next-page>
							<kc-tc-last-page></kc-tc-last-page>
						</div>
						<div class="flex"></div>
						<div><kc-tc-page-select></kc-tc-page-select></div>
						<div class="flex"></div>
						<div><kc-tc-page-size></kc-tc-page-size></div>
					</div>
				</k-table>
			</k-tab-content>

			<k-tab-content name="extension">
				<k-table open-on-click
					id="extensionTable"
					enable-pages
					page-size="25"
					page-size-options="[10,25,50,100]"
					placeholder="No extension pages installed."
				>
					<kc-tc-open slot="before"></kc-tc-open>
					<div
						slot="top"
						class="d-f full"
						style="align-items: center;"
					>
						<div class="flex"></div>
						<div>
							<input type="search" class="page-search" placeholder="Search extension pages" aria-label="Search extension pages">
						</div>
					</div>
					<div
						class="d-f full"
						style="align-items: center;"
					>
						<div>
							<kc-tc-first-page></kc-tc-first-page>
							<kc-tc-prev-page></kc-tc-prev-page>
							<kc-tc-next-page></kc-tc-next-page>
							<kc-tc-last-page></kc-tc-last-page>
						</div>
						<div class="flex"></div>
						<div><kc-tc-page-select></kc-tc-page-select></div>
						<div class="flex"></div>
						<div><kc-tc-page-size></kc-tc-page-size></div>
					</div>
				</k-table>
			</k-tab-content>

			<k-tab-content name="system">
				<k-table open-on-click
					id="systemTable"
					enable-pages
					page-size="25"
					page-size-options="[10,25,50,100]"
					placeholder="No system pages found."
				>
					<kc-tc-open slot="before"></kc-tc-open>
					<div
						slot="top"
						class="d-f full"
						style="align-items: center;"
					>
						<div class="flex"></div>
						<div>
							<input type="search" class="page-search" placeholder="Search system pages" aria-label="Search system pages">
						</div>
					</div>
					<div
						class="d-f full"
						style="align-items: center;"
					>
						<div>
							<kc-tc-first-page></kc-tc-first-page>
							<kc-tc-prev-page></kc-tc-prev-page>
							<kc-tc-next-page></kc-tc-next-page>
							<kc-tc-last-page></kc-tc-last-page>
						</div>
						<div class="flex"></div>
						<div><kc-tc-page-select></kc-tc-page-select></div>
						<div class="flex"></div>
						<div><kc-tc-page-size></kc-tc-page-size></div>
					</div>
				</k-table>
			</k-tab-content>

			<location name="admin-pages-tabs" />
		</k-tabs>

		<script type="module">
			import { listPages, rescanPages, listTemplates, listDirectories, createPage, deletePages, getAllCurrentUserPermissions } from '/kempo/sdk.js';
			import { html } from '/kempo-ui/lit-all.min.js';
			import Dialog from '/kempo-ui/components/Dialog.js';
			import Toast from '/kempo-ui/components/Toast.js';

			await window.customElements.whenDefined('k-table');

			const [, permData] = await getAllCurrentUserPermissions();
			const myPerms = new Set(permData?.permissions ?? []);

			const fields = [
				{ name: 'locked', label: '', size: 40, calculator: r => r.locked ? html`<k-icon name="lock"></k-icon>` : html`` },
				{ name: 'name', label: 'Name', size: 200 },
				{ name: 'url', label: 'URL', size: 250 },
				{ name: 'author', label: 'Author', size: 150 },
				{ name: 'description', label: 'Description' },
				{ name: 'updatedAt', label: 'Updated', size: 190, formatter: v => v ? new Date(v).toLocaleString() : '' },
				{ name: 'createdAt', label: 'Created', size: 190, formatter: v => v ? new Date(v).toLocaleString() : '' }
			];

			const extensionFields = [
				{ name: 'owner', label: 'Extension', size: 120 },
				...fields
			];

			const $customTable = document.getElementById('customTable');
			const $extensionTable = document.getElementById('extensionTable');
			const $systemTable = document.getElementById('systemTable');

			const $scanInfo = document.getElementById('scanInfo');
			const $rescanBtn = document.getElementById('rescanBtn');
			let scannedAt = null;

			const formatAge = ts => {
				const s = Math.floor((Date.now() - ts) / 1000);
				if(s < 60) return `${s}s ago`;
				if(s < 3600) return `${Math.floor(s / 60)}m ago`;
				return `${Math.floor(s / 3600)}h ago`;
			};

			const updateScanInfo = () => {
				$scanInfo.textContent = scannedAt ? `Scanned ${formatAge(scannedAt)}` : '';
			};

			setInterval(updateScanInfo, 1000);

			const withEditUrl = p => ({ ...p, _url: `/admin/content/pages/edit?path=${encodeURIComponent(p.file.replace(/\.page\.html$/, ''))}` });

			const tables = [
				{ $table: $customTable, owner: 'custom', fields, emptyText: 'No custom pages have been created yet.' },
				{ $table: $extensionTable, owner: 'extension', fields: extensionFields, emptyText: 'No extension pages installed.' },
				{ $table: $systemTable, owner: 'system', fields, emptyText: 'No system pages found.' }
			];

			const searchTerm = $table => $table.querySelector('.page-search').value.trim();

			const loadTable = async ({ $table, owner, fields: tableFields, emptyText }) => {
				const q = searchTerm($table);
				const [error, data] = await listPages({ q, owner, showHidden: false, offset: 0, limit: $table.getPageSize() });
				if(error){
					Toast.error(error.msg || 'Failed to load pages');
					return null;
				}
				$table.placeholder = q ? 'No pages match your search.' : emptyText;
				$table.setData({ currentPage: 1, records: data.pages.map(withEditUrl), fields: tableFields });
				$table.setupFetchRecords(data.total, async (start, count) => {
					const [, d] = await listPages({ q: searchTerm($table), owner, showHidden: false, offset: start, limit: count });
					return (d?.pages || []).map(withEditUrl);
				});
				return data.scannedAt;
			};

			/* Each tab loads its list the first time it is shown. The scan time comes from whichever list loaded. */
			const loadWhenShown = table => {
				const pane = table.$table.closest('k-tab-content');
				const load = async () => {
					const ts = await loadTable(table);
					if(ts != null){
						scannedAt = ts;
						updateScanInfo();
					}
				};
				if(pane.active) load();
				else table.$table.closest('k-tabs').addEventListener('tabfirstshown', ({ detail }) => {
					if(detail.tab === pane.name) load();
				});
			};
			tables.forEach(loadWhenShown);

			for(const table of tables){
				let searchTimer;
				table.$table.querySelector('.page-search').addEventListener('input', () => {
					clearTimeout(searchTimer);
					searchTimer = setTimeout(() => loadTable(table), 300);
				});
			}

			$rescanBtn.addEventListener('click', async () => {
				$rescanBtn.disabled = true;
				const [error] = await rescanPages();
				if(error){
					$rescanBtn.disabled = false;
					Toast.error(error.msg || 'Rescan failed');
					return;
				}
				window.location.reload();
			});

			if(myPerms.has('system:pages:delete')){
				$customTable.setAttribute('request-delete', '');
				$customTable.setAttribute('enable-selection', '');
				const del = document.createElement('kc-tc-delete-record');
				del.setAttribute('slot', 'after');
				$customTable.appendChild(del);
			}


			$customTable.addEventListener('requestDelete', ({ detail: { records, approve, reject } }) => {
				const locked = records.filter(r => r.locked);
				if(locked.length){
					Toast.error(locked.length === 1 ? `"${locked[0].title || locked[0].file}" is locked and cannot be deleted.` : `${locked.length} selected pages are locked and cannot be deleted.`);
					reject();
					return;
				}
				const count = records.length;
				const msg = count === 1
					? `Delete "${records[0].title || records[0].file}"? This action cannot be undone.`
					: `Delete ${count} pages? This action cannot be undone.`;
				Dialog.confirm(msg, async (confirmed) => {
					if(!confirmed){ reject(); return; }
					const files = records.map(r => r.file);
					const [error] = await deletePages(files);
					if(error){
						reject();
						Toast.error(error.msg || 'Failed to delete');
						return;
					}
					approve();
					Toast.success(count === 1 ? 'Page deleted' : `${count} pages deleted`);
				});
			});

			/*
				Create Page Dialog
			*/

			const slugify = name => name
				.toLowerCase()
				.trim()
				.replace(/[^\w\s-]/g, '')
				.replace(/[\s_]+/g, '-')
				.replace(/-+/g, '-')
				.replace(/^-|-$/g, '');

			document.getElementById('createPageBtn')?.addEventListener('click', async () => {
				const [[tplError, tplData], [dirError, dirData]] = await Promise.all([
					listTemplates(),
					listDirectories()
				]);
				if(tplError){
					Toast.error(tplError.msg || 'Failed to load templates');
					return;
				}
				if(dirError){
					Toast.error(dirError.msg || 'Failed to load directories');
					return;
				}

				const directories = dirData.directories;

				const templateOptions = tplData.templates
					.map(t => html`<option value="${t.name}" ?selected=${t.name === 'default'}>${t.name} (${t.directory || '/'})</option>`);

				const isValidDir = p => /^\/[a-zA-Z0-9_\-\[\]\/]*$/.test(p) && !p.includes('..') && !p.includes('//');
				const dirToInternal = p => { const t = (p || '/').replace(/^\//, '').replace(/\/$/, ''); return t || '.'; };

				const openLearnMore = () => Dialog.alert(html`
					<div class="p">
						<p>Directory paths define where a page lives in the URL structure.</p>
						<p><strong>Examples:</strong></p>
						<ul>
							<li><code>/</code> — root, e.g. <code>/about</code></li>
							<li><code>/blog</code> — e.g. <code>/blog/my-post</code></li>
							<li><code>/blog/[slug]</code> — dynamic segment; <code>[slug]</code> matches any value</li>
						</ul>
						<p>Dynamic segments like <code>[token]</code> allow a single page to handle many URLs. The segment name is available to the page as a URL parameter.</p>
						<p>You can nest segments: <code>/store/[category]/[id]</code></p>
					</div>
				`, null, { title: 'About Directory Paths' });

				const $dialog = Dialog.create(html`
					<div class="p">
						<div class="mb">
							<label class="d-b mb-sm">Location</label>
							<input type="text" id="dlg-directory" class="full" list="dlg-dir-list" value="/" placeholder="/">
							<datalist id="dlg-dir-list">
								${directories.map(d => html`<option value="${d === '.' ? '/' : '/' + d}">`)}
							</datalist>
							<p id="dlg-dir-error" class="mt-sm tc-danger d-n"><small>Invalid path — use format: /path/to/directory</small></p>
							<p class="mt-sm muted"><small>Supports dynamic segments e.g. <code>/blog/[slug]</code>. <button class="link" @click="${openLearnMore}">Learn more</button></small></p>
						</div>
						<div class="mb">
							<label class="d-b mb-sm">Page Name</label>
							<input type="text" id="dlg-name" class="full" placeholder="My New Page" required>
							<p class="mt-sm muted"><small id="dlg-slug"></small></p>
						</div>
						<div>
							<label class="d-b mb-sm">Template</label>
							<select id="dlg-template" class="full">
								${templateOptions}
							</select>
						</div>
					</div>
				`, {
					title: 'Create Page',
					confirmText: 'Create',
					confirmAction: async () => {
						const name = $dialog.querySelector('#dlg-name').value.trim();
						const dirInput = $dialog.querySelector('#dlg-directory').value.trim() || '/';
						const template = $dialog.querySelector('#dlg-template').value;

						if(!name){
							Toast.error('Page name is required');
							return;
						}

						if(!isValidDir(dirInput)){
							Toast.error('Invalid directory path');
							return;
						}

						const directory = dirToInternal(dirInput);

						const [error, data] = await createPage({
							directory: directory === '.' ? '' : directory,
							name,
							template
						});

						if(error){
							Toast.error(error.msg || 'Failed to create page');
							return;
						}

						Toast.success('Page created — redirecting to editor...');
						setTimeout(() => {
						window.location.href = `/admin/content/pages/edit?path=${encodeURIComponent(data.file.replace(/\.page\.html$/, ''))}`;
						}, 1500);
					},
					cancelText: 'Cancel'
				});

				const updateSlug = () => {
					const slug = slugify($dialog.querySelector('#dlg-name').value);
					const dir = dirToInternal($dialog.querySelector('#dlg-directory').value);
					const prefix = dir === '.' ? '/' : '/' + dir + '/';
					$dialog.querySelector('#dlg-slug').textContent = slug ? prefix + slug : '';
				};
				$dialog.querySelector('#dlg-directory').addEventListener('input', e => {
					$dialog.querySelector('#dlg-dir-error').classList.toggle('d-n', isValidDir(e.target.value || '/'));
					updateSlug();
				});
				$dialog.querySelector('#dlg-name').addEventListener('input', updateSlug);
			});
		</script>
	</content>
</page>
