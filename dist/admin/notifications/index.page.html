<page title="Notifications - Admin">
<content>
<script type="module" src="/kempo-ui/components/Icon.js"></script>
<script type="module" src="/kempo/components/NotificationHistory.js"></script>

	<div class="d-f mb">
		<h1 class="flex mb0">Notifications</h1>
		<button id="markAllRead"><k-icon name="done_all"></k-icon> Mark all read</button>
	</div>

	<k-notification-history id="history"></k-notification-history>

	<p class="small tc-muted">
		Dismissing a notification only removes it from your list; it stays in your history. Notifications are deleted for everyone once they are
		older than the retention set by <code>system:notification_retention_days</code> (default 90 days).
	</p>

</content>
<content location="scripts">
<script type="module">
	import { markAllNotificationsViewed } from '/kempo/sdk.js';

	document.getElementById('markAllRead').addEventListener('click', async () => {
		await markAllNotificationsViewed();
		await document.getElementById('history').querySelector('k-notification-list').refresh();
	});
</script>
</content>
</page>
