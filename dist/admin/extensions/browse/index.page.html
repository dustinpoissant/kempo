<page title="Browse Extensions - Admin">
<content>
<script type="module" src="/kempo-ui/components/Icon.js"></script>
<script type="module" src="/kempo-ui/components/Rating.js"></script>
<script type="module" src="/kempo-ui/components/Pagination.js"></script>
<script type="module" src="/kempo-ui/components/Spinner.js"></script>
<script type="module" src="/kempo/components/Permission.js"></script>

	<div class="d-f mb">
		<a href="/admin/extensions" class="no-link">
			<button><k-icon name="arrow" direction="left"></k-icon> Extensions</button>
		</a>
	</div>
	<h1>Browse Extensions</h1>
	<p class="tc-muted">Extensions from the Kempo marketplace. Pick one to see what it does and what it needs before installing it.</p>

	<div class="row mb">
		<div class="col mr">
			<input id="search" type="search" placeholder="Search extensions" aria-label="Search extensions" class="full" />
		</div>
		<div>
			<select id="sort" aria-label="Sort by">
				<option value="installs">Most installed</option>
				<option value="rating">Highest rated</option>
				<option value="name">Name</option>
				<option value="updated">Recently updated</option>
			</select>
		</div>
	</div>

	<div id="notice" class="tc-danger mb" hidden></div>
	<div id="cards" class="d-g cols-3 t-cols-2 m-cols-1"></div>
	<p id="empty" class="tc-muted" hidden>No extensions match that search.</p>
	<k-pagination id="pagination" controls="simple" items-per-page="12" total-items="0" page="1"></k-pagination>

</content>
<content location="scripts">
<script type="module">
	import { listKnownExtensions } from '/kempo/sdk.js';

	const PAGE = 12;
	const cards = document.getElementById('cards');
	const search = document.getElementById('search');
	const sort = document.getElementById('sort');
	const notice = document.getElementById('notice');
	const empty = document.getElementById('empty');
	const pagination = document.getElementById('pagination');

	let timer;
	let loading = false;

	const card = item => {
		const link = document.createElement('a');
		link.className = 'card no-link d-b';
		link.href = `/admin/extensions/details/?name=${encodeURIComponent(item.name)}`;

		const title = document.createElement('h3');
		title.className = 'mb0';
		title.textContent = item.name;

		const text = document.createElement('p');
		text.textContent = item.description || 'No description.';

		const rating = document.createElement('k-rating');
		rating.setAttribute('disabled', '');
		rating.value = Math.round(item.rating.average || 0);

		const meta = document.createElement('p');
		meta.className = 'tc-muted';
		meta.textContent = `${item.rating.count ? `${item.rating.average} (${item.rating.count}) · ` : ''}${item.installs} install${item.installs === 1 ? '' : 's'}`;

		link.append(title, text, rating, meta);
		return link;
	};

	const load = async page => {
		loading = true;
		const [error, data] = await listKnownExtensions({
			search: search.value.trim() || undefined,
			sort: sort.value,
			limit: PAGE,
			offset: (page - 1) * PAGE,
		});

		notice.hidden = !error;
		if(error){
			notice.textContent = error.msg;
			cards.replaceChildren();
			empty.hidden = true;
			loading = false;
			return;
		}

		cards.replaceChildren(...data.items.map(card));
		empty.hidden = data.total > 0;
		pagination.totalItems = data.total;
		pagination.page = page;
		pagination.classList.toggle('d-n', data.total <= PAGE);
		loading = false;
	};

	pagination.addEventListener('page-change', event => {
		if(!loading && event.detail.currentPage !== undefined) load(event.detail.currentPage);
	});

	search.addEventListener('input', () => {
		clearTimeout(timer);
		timer = setTimeout(() => load(1), 300);
	});
	sort.addEventListener('change', () => load(1));

	load(1);
</script>
</content>
</page>
