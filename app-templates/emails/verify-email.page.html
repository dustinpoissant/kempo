<page template="email" title="Verify Your Email">
<content>
<h2>Verify Your Email</h2>
<if condition="name"><p>Hi {{name}},</p></if>
<if condition="!name"><p>Hello,</p></if>
<p>Thank you for signing up! Please verify your email address by clicking the button below:</p>
<div style="text-align: center; margin: 24px 0;">
	<a href="{{verificationLink}}" style="display: inline-block; padding: 14px 28px; background-color: rgb(51, 102, 255); color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600;">Verify Email</a>
</div>
<p class="small" style="word-break: break-all; padding: 12px; border-radius: 4px;">Or copy and paste this link into your browser:<br><strong>{{verificationLink}}</strong></p>
<div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid; font-size: 13px;">
	<p>If you didn't create an account, you can safely ignore this email.</p>
</div>
</content>
</page>
