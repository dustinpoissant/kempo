# Database for kempo's own test suite. Application development happens in kempo-demo, which runs
# its own database on 5433 — this one deliberately uses 5434 so both can be up at once.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo_test_password
      POSTGRES_DB: kempo_test
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kempo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_test_data:
