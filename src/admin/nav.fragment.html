<!--
	locked: true
-->
<fragment>
	<k-aside
		main="push"
		state="expanded"
		style="--aside_padding: 0;"
		persistent-id="admin-nav"
		group-icons='{"Accounts":"manage-accounts","Content":"cards_stack","Settings":"settings","Commerce":"storefront"}'
	>
		<k-aside-toggle>
			<h3 class="m0">Kempo Admin</h3>
		</k-aside-toggle>
		<k-aside-item
			icon="preview"
			href="/"
			group="Site"
			no-expand
		>Site</k-aside-item>
		<k-aside-item
			icon="cards"
			href="/admin"
			group="Dashboard"
			no-expand
		>Dashboard</k-aside-item>
		<k-aside-item
			icon="person"
			href="/admin/accounts/users"
			group="Accounts"
			no-expand
		>Users</k-aside-item>
		<k-aside-item
			icon="group"
			href="/admin/accounts/groups"
			group="Accounts"
			no-expand
		>Groups</k-aside-item>
		<k-aside-item
			icon="lock"
			href="/admin/accounts/permissions"
			group="Accounts"
			no-expand
		>Permissions</k-aside-item>
		<k-aside-item
			icon="browse"
			href="/admin/content/templates"
			group="Content"
			no-expand
		>Templates</k-aside-item>
		<k-aside-item
			icon="docs"
			href="/admin/content/pages"
			group="Content"
			no-expand
		>Pages</k-aside-item>
		<k-aside-item
			icon="content"
			href="/admin/content/fragments"
			group="Content"
			no-expand
		>Fragments</k-aside-item>
		<k-aside-item
			icon="globe"
			href="/admin/content/globals"
			group="Content"
			no-expand
		>Global Content</k-aside-item>
		<k-aside-item
			icon="menu"
			href="/admin/content/menus"
			group="Content"
			no-expand
		>Menus</k-aside-item>
		<k-aside-item
			icon="settings"
			href="/admin/settings"
			group="Settings"
			no-expand
		>Admin Settings</k-aside-item>
		<k-aside-item
			icon="extension"
			href="/admin/extensions"
			group="Settings"
			no-expand
		>Extensions</k-aside-item>
		<location name="admin-nav-extensions"></location>
		<k-aside-item
			icon="sensors"
			href="/admin/realtime"
			group="Games"
			no-expand
		>Realtime Connections</k-aside-item>
		<k-aside-spacer></k-aside-spacer>
		<k-admin-nav-footer class="pxh pyh">
			<k-theme-switcher class="d-b" labels style="--padding:var(--spacer_h)"></k-theme-switcher>
			<span class="flex"></span>
			<k-notification-bell class="d-b" page-href="/admin/notifications" open-direction="up right" button-class="ph r"></k-notification-bell>
		</k-admin-nav-footer>
	</k-aside>
	<script type="module">
		import '/kempo-ui/components/ThemeSwitcher.js';
		import '/kempo/components/NotificationBell.js';
		import '/kempo/components/AdminNavFooter.js';
		const items = document.querySelectorAll('k-aside-item');
		const currentPath = window.location.pathname;

		items.forEach(item => {
			const href = item.getAttribute('href');
			if (!href) return;
			const isExact = href === '/admin' || href === '/';
			const match = isExact
				? (currentPath === href || currentPath === href + '/')
				: (currentPath === href || currentPath.startsWith(href + '/'));
			if (match) {
				item.setAttribute('active', '');
				const menu = item.closest('k-aside-menu');
				if (menu) menu.setAttribute('open', '');
			}
		});
	</script>
</fragment>
