name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # kempo-server and kempo-ui resolve from the registry, which is what a consumer installing this
  # package gets. This is the gate that has to stay green.
  published:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci

      - name: Build
        run: npm run build

      # No database or RESEND_API_KEY: the postgres client connects lazily and the Resend client is
      # constructed on first send, so the whole module graph loads without either configured.
      - name: Run Unit Tests
        run: npm test

  # Same suite against the sibling checkouts rather than the last release, which is where the two
  # packages break each other. Advisory: a red run here means kempo and kempo-server have diverged
  # and one of them needs to ship, not that this commit is bad.
  siblings:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: kempo

      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo-server
          path: kempo-server

      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo-ui
          path: kempo-ui

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci
        working-directory: kempo

      # Swaps the registry copies for the sibling checkouts. --no-save, so package.json and the
      # lockfile stay exactly as committed.
      - name: Link sibling checkouts
        run: npm run link:local
        working-directory: kempo

      - name: Build
        run: npm run build
        working-directory: kempo

      - name: Run Unit Tests
        run: npm test
        working-directory: kempo
